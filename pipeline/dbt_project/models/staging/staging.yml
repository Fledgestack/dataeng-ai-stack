version: 2
models:
  - name: stg_users
    columns:
      - name: user_id
        data_tests: [unique, not_null]
  - name: stg_posts
    columns:
      - name: post_id
        data_tests: [unique, not_null]
      - name: user_id
        data_tests:
          - relationships:
              arguments: { to: ref('stg_users'), field: user_id }
  - name: stg_comments
    columns:
      - name: comment_id
        data_tests: [unique, not_null]
